repos:
  - repo: local
    hooks:
      - id: biome-check
        name: Biome check
        entry: ./node_modules/.bin/biome check --write
        language: system
        files: '\.(?:[cm]?[jt]sx?|jsonc?|css|graphql|gql)$'
        stages: [pre-commit]
      - id: npm-check
        name: npm run check
        entry: npm run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
